name: organizers-eval
# Measures Find Organizer accuracy against the answer key (tests/fixtures/find_organizer_truth.json).
# Runs on demand, or on any push to the branch eval/find-organizer. Results land on the branch eval-results
# (names and websites only; no emails or phone numbers are written there because this repo is public).
on:
  workflow_dispatch:
    inputs:
      stages: { description: "stages to run (stored,tm,documents,research)", default: "research" }
      limit:  { description: "how many events (each research call costs ~$0.10-0.20)", default: "20" }
  push:
    branches: [eval/find-organizer]
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Offline tests
        run: python -m pytest tests -q
      - name: Run Find Organizer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          STAGES: ${{ github.event.inputs.stages || 'research' }}
          LIMIT: ${{ github.event.inputs.limit || '20' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY secret is missing" | tee eval_note.txt; fi
          if [ -z "$ANTHROPIC_WORKSPACE_ID" ]; then echo "ANTHROPIC_WORKSPACE_ID secret is missing" | tee -a eval_note.txt; fi
          python -m collectors.organizers.find --fixture tests/fixtures/find_organizer_truth.json \
            --pool tests/fixtures/listing_pool.json --stages "$STAGES" --limit "$LIMIT" --out results.jsonl
          python tools/eval_find_organizer.py results.jsonl | tee summary.txt
          python tools/eval_find_organizer.py results.jsonl --usage | tee -a summary.txt
          cat summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Save summary to eval-results branch
        if: always()
        run: |
          touch summary.txt
          git config user.name "github-actions"; git config user.email "actions@github.com"
          mkdir -p /tmp/out && cp summary.txt /tmp/out/ && [ -f eval_note.txt ] && cp eval_note.txt /tmp/out/ || true
          if git fetch -q origin eval-results 2>/dev/null; then git checkout -q -B eval-results origin/eval-results
          else git checkout -q --orphan eval-results && git rm -rq --cached . ; fi
          stamp=$(date -u +%Y%m%dT%H%M)
          mkdir -p find && cp /tmp/out/summary.txt "find/${stamp}-${STAGES:-research}.txt"
          [ -f /tmp/out/eval_note.txt ] && cp /tmp/out/eval_note.txt find/ || true
          git add find && git commit -qm "find organizer eval ${stamp}" && git push origin eval-results
        env:
          STAGES: ${{ github.event.inputs.stages || 'research' }}

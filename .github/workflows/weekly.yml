name: weekly-event-collection
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC (Sunday 2am ET)
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false            # one source failing never cancels the others
      matrix:
        source: [tourneymachine, fairsandfestivals, eventeny, mayouthsoccer, woodgoods_lacrosse]
    name: ${{ matrix.source }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Run ${{ matrix.source }}
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FF_COOKIE: ${{ secrets.FF_COOKIE }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python run.py ${{ matrix.source }}
